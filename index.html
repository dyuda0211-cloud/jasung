            function updateQuoteEstimate() {
                 let productSubtotal = 0;
                 let serviceSubtotal = 0;

                 document.querySelectorAll('input[name="product"]:checked').forEach(input => {
                     productSubtotal += parseFloat(input.dataset.price);
                 });
                 document.querySelectorAll('input[name="service"]:checked').forEach(input => {
                     serviceSubtotal += parseFloat(input.dataset.price);
                 });

                 const totalSubtotal = productSubtotal + serviceSubtotal;
                 const tax = totalSubtotal * 0.11;
                 const total = totalSubtotal + tax;

                 const estimateEl = document.getElementById('total-estimate');
                 if(estimateEl) {
                    estimateEl.innerHTML = `
                        <div class="space-y-3 text-sm">
                            <div class="flex justify-between"><span>Subtotal Produk</span><span>${new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(productSubtotal)}</span></div>
                            <div class="flex justify-between"><span>Subtotal Layanan</span><span>${new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(serviceSubtotal)}</span></div>
                            <div class="flex justify-between border-t pt-3"><span>Pajak (11%)</span><span>${new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(tax)}</span></div>
                            <div class="flex justify-between text-lg font-medium text-gray-900 border-t pt-3"><span>Total Estimasi</span><span class="text-purple-600">${new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(total)}</span></div>
                        </div>
                    `;
                 }
            }

            function renderFooter() {
                const footer = document.getElementById('footer');
                footer.innerHTML = `
                 <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-16 pb-12">
                     <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-8">
                         <div class="lg:col-span-2">
                             <div class="flex items-center mb-4">
                                 <div class="w-8 h-8 bg-gradient-to-r from-purple-600 to-purple-400 rounded-lg mr-3"></div>
                                 <span class="text-xl font-medium">Jasung</span>
                             </div>
                             <p data-key="footer_about" class="text-gray-400 text-sm max-w-sm mb-6"></p>
                         </div>
                         <div class="text-sm">
                             <h4 data-key="footer_company" class="font-medium text-white mb-4"></h4>
                             <ul class="space-y-3 text-gray-400">
                                <li><a href="#about" data-key="nav_about" data-navigate="about" class="hover:text-white"></a></li>
                                <li><a href="#news" data-key="nav_news" data-navigate="news" class="hover:text-white"></a></li>
                             </ul>
                         </div>
                         <div class="text-sm"><h4 data-key="footer_services" class="font-medium text-white mb-4"></h4></div>
                         <div class="text-sm"></div>
                     </div>
                     <div class="mt-12 pt-8 border-t border-gray-800 flex flex-col md:flex-row items-center justify-between">
                         <div class="mb-4 md:mb-0 text-center md:text-left">
                             <h4 data-key="footer_newsletter" class="font-medium text-white"></h4>
                             <p data-key="footer_newsletter_sub" class="text-gray-400 text-sm"></p>
                         </div>
                         <div class="flex w-full md:w-auto">
                             <input type="email" placeholder="Email address" class="flex-1 md:w-64 px-4 py-2 bg-gray-800 border border-gray-700 rounded-l-lg text-white">
                             <button data-key="footer_subscribe_btn" class="px-6 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-r-lg"></button>
                         </div>
                     </div>
                 </div>
                 <div class="border-t border-gray-800">
                     <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                         <div class="flex flex-col md:flex-row items-center justify-between">
                             <div data-key="footer_copyright" class="text-gray-400 text-sm mb-4 md:mb-0"></div>
                             <div class="flex items-center space-x-6 text-sm text-gray-400">
                                 <span data-key="footer_powered_by"></span>
                                 <div class="flex items-center space-x-1"><span>🌱</span><span>⚡️</span><span>♻️</span></div>
                             </div>
                         </div>
                     </div>
                 </div>`;
            }

            const router = {
                routes: {
                    'home': () => renderHero() + renderServices() + renderHomeNews(),
                    'products': renderProductsPage,
                    'product-detail': renderProductDetailPage,
                    'news': renderNewsPage,
                    'blog-detail': renderBlogDetailPage,
                    'quote': renderQuotePage,
                    'about': renderAbout,
                    'contact': renderContact,
                },
                render(page, id) {
                    const renderer = this.routes[page] || this.routes['home'];
                    pageContent.innerHTML = renderer(id);
                    renderFooter();
                    translateUI();
                    
                    updateActiveNavLink(page);
                    attachEventListeners(page);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };

            function attachEventListeners(page) {
                if (page === 'home') {
                    $('.hero-carousel').not('.slick-initialized').slick({
                        dots: true, infinite: true, speed: 500, fade: true, cssEase: 'linear', autoplay: true, autoplaySpeed: 5000,
                    });
                }
                if (page === 'product-detail') {
                    const tabTriggers = document.querySelectorAll('.tab-trigger');
                    const tabContents = document.querySelectorAll('.tab-content');
                    tabTriggers.forEach(trigger => {
                        trigger.addEventListener('click', () => {
                            tabTriggers.forEach(t => t.classList.remove('text-purple-600', 'border-purple-500'));
                            trigger.classList.add('text-purple-600', 'border-purple-500');
                            tabContents.forEach(c => c.classList.add('hidden'));
                            document.getElementById(`${trigger.dataset.tab}-content`).classList.remove('hidden');
                        });
                    });
                }
                if (page === 'quote') {
                    const calculator = document.getElementById('quote-calculator');
                    if (calculator) {
                        calculator.addEventListener('change', updateQuoteEstimate);
                        updateQuoteEstimate();
                    }
                }
            }

            function handleNavigation(e) {
                const target = e.target.closest('[data-navigate]');
                if (target) {
                    e.preventDefault();
                    const page = target.dataset.navigate;
                    const id = target.dataset.id;
                    window.location.hash = id ? `${page}/${id}` : page;
                }
            }
            
            function handleHashChange() {
                const hash = window.location.hash.slice(1) || 'home';
                const [page, id] = hash.split('/');
                router.render(page, id);
            }
            
            function updateActiveNavLink(currentPage) {
                 document.querySelectorAll('.nav-link').forEach(link => {
                    const linkPage = link.dataset.navigate || link.getAttribute('href').slice(1);
                    const mainPage = currentPage.split('-')[0];
                    if (linkPage === currentPage || linkPage === mainPage) {
                        link.classList.add('text-purple-600', 'font-medium');
                        link.classList.remove('text-gray-600');
                        if(link.classList.contains('mobile-link')) {
                           link.classList.add('bg-purple-50');
                        }
                    } else {
                        link.classList.remove('text-purple-600', 'font-medium', 'bg-purple-50');
                        link.classList.add('text-gray-600');
                    }
                });
            }

            function handleLanguageChange(e) {
                const lang = e.target.dataset.lang;
                if (lang && lang !== currentLang) {
                    loadLanguage(lang);
                    handleHashChange();
                }
            }

            // --- HEADER INTERACTIVITY ---
            mobileMenuButton.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
                mobileMenuOpenIcon.classList.toggle('hidden');
                mobileMenuCloseIcon.classList.toggle('hidden');
            });

            document.querySelectorAll('.mobile-link').forEach(link => {
                link.addEventListener('click', () => {
                    mobileMenu.classList.add('hidden');
                    mobileMenuOpenIcon.classList.remove('hidden');
                    mobileMenuCloseIcon.classList.add('hidden');
                });
            });

            desktopProductsDropdownContainer.addEventListener('mouseenter', () => desktopProductsDropdown.classList.remove('hidden'));
            desktopProductsDropdownContainer.addEventListener('mouseleave', () => desktopProductsDropdown.classList.add('hidden'));

            // --- INITIALIZATION ---
            document.querySelector('.lang-switch').addEventListener('click', handleLanguageChange);
            document.body.addEventListener('click', handleNavigation);
            window.addEventListener('hashchange', handleHashChange);
            
            loadLanguage('id');
            handleHashChange();
        });
    </script>

</body>
</html>
